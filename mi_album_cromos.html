<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101d35">
<title>Mi Álbum · Gestor de cromos</title>
<style>
:root{--ink:#15233d;--muted:#6b7891;--line:#e4eaf1;--bg:#f5f7fb;--nav:#101d35;--green:#19a779;--gold:#eba93c;--white:#fff;--shadow:0 8px 26px rgba(27,48,88,.06)}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.shell{min-height:100vh;display:grid;grid-template-columns:246px 1fr}.sidebar{background:var(--nav);color:white;padding:28px 16px;display:flex;flex-direction:column;gap:24px}.brand{font-size:22px;font-weight:850;letter-spacing:-.7px;display:flex;align-items:center;gap:11px;padding:0 12px}.brand-mark{background:#25b58b;border-radius:12px;padding:8px;font-size:23px}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#abb7cb;text-align:left;border-radius:11px;padding:13px 14px;font-weight:650;display:flex;align-items:center;gap:12px}.nav button:hover,.nav button.active{background:#263955;color:#fff}.nav button.active:before{content:'';width:4px;height:16px;background:#35d6a1;border-radius:9px;margin-left:-7px}.sidefoot{margin-top:auto;padding:14px 12px;color:#9aaac2;font-size:12px;line-height:1.65}.main{min-width:0;padding:34px clamp(18px,4vw,54px) 60px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:30px}.eyebrow{color:var(--green);font-weight:780;font-size:12px;letter-spacing:1.5px;text-transform:uppercase}.heading{font-size:clamp(26px,3vw,35px);margin:5px 0 0;letter-spacing:-1.2px}.sub{color:var(--muted);font-size:14px;margin:8px 0 0}.btn{border:1px solid var(--line);background:white;padding:11px 16px;border-radius:11px;font-weight:750;color:var(--ink);display:inline-flex;gap:8px;align-items:center;justify-content:center}.btn:hover{filter:brightness(.975)}.primary{border-color:var(--green);background:var(--green);color:white}.danger{background:#fff0f1;border-color:#ffd9de;color:#b8334b}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px;margin-bottom:28px}.stat{background:white;border:1px solid var(--line);border-radius:17px;padding:20px;box-shadow:var(--shadow)}.stat .label{font-size:13px;color:var(--muted);font-weight:650}.stat .num{font-weight:850;font-size:32px;letter-spacing:-1.3px;margin-top:8px}.stat small{display:block;margin-top:8px;color:var(--muted)}.section-title{font-size:19px;letter-spacing:-.5px;margin:0}.section-head{display:flex;justify-content:space-between;align-items:center;gap:15px;margin:25px 0 15px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.collection{background:white;border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:var(--shadow);text-align:left;cursor:pointer}.collection:hover{transform:translateY(-2px);transition:.12s}.cover{height:120px;background:linear-gradient(120deg,#10203b,#1c806c);display:flex;align-items:center;justify-content:space-between;padding:22px;color:white;position:relative;overflow:hidden}.cover:after{content:'⚽';position:absolute;right:20px;bottom:-28px;font-size:112px;opacity:.22}.cover .cover-name{font-size:22px;font-weight:850;line-height:1.1;max-width:75%;z-index:1}.collection-body{padding:18px}.collection-meta{font-size:12px;color:var(--muted);margin:6px 0 16px}.progress{height:8px;border-radius:20px;background:#e9eef4;overflow:hidden;margin-top:11px}.progress span{height:100%;background:var(--green);display:block;border-radius:20px}.between{display:flex;justify-content:space-between;gap:10px}.muted{color:var(--muted)}.tiny{font-size:12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.input,.select,.textarea{border:1px solid #dce4ed;border-radius:11px;background:white;padding:12px 13px;min-width:0;color:var(--ink);outline:none}.input:focus,.select:focus,.textarea:focus{border-color:#20b58a;box-shadow:0 0 0 3px #20b58a22}.search{flex:1;min-width:190px}.stickers{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:15px}.sticker{background:white;border:1px solid var(--line);border-radius:15px;overflow:hidden;cursor:pointer;box-shadow:var(--shadow);transition:transform .12s}.sticker:hover{transform:translateY(-3px)}.sticker-art{aspect-ratio:3/3.8;background:linear-gradient(135deg,#dcefe7,#b7d6ce);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}.sticker-art img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:45px;opacity:.48}.sticker-body{padding:12px}.sticker-title{font-weight:750;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.sticker-meta{color:var(--muted);font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:5px}.pill{font-size:10px;display:inline-block;border-radius:100px;padding:5px 8px;margin-top:9px;font-weight:800;background:#eef1f6;color:#6f7890}.pill.owned{background:#e5f8f0;color:#168765}.pill.missing{background:#fff0e1;color:#a76818}.pill.duplicate{background:#eaeafb;color:#6264b6}.empty{border:1px dashed #cfd7e2;text-align:center;background:#fff;padding:48px 20px;border-radius:18px;color:var(--muted);grid-column:1/-1}.empty h3{color:var(--ink);margin-bottom:5px}.panel{padding:22px;border:1px solid var(--line);background:white;border-radius:17px;box-shadow:var(--shadow)}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:flex;flex-direction:column;gap:7px;font-size:13px;font-weight:700}.field.full{grid-column:1/-1}.field small{font-weight:400;color:var(--muted)}.textarea{resize:vertical;min-height:75px}.modal-back{position:fixed;inset:0;background:#08162bb0;display:flex;align-items:center;justify-content:center;padding:20px;z-index:20}.modal{width:min(620px,100%);max-height:92vh;overflow-y:auto;background:white;border-radius:19px;box-shadow:0 24px 80px #0004;padding:25px}.modalhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px}.modalhead h2{margin:0;font-size:22px}.close{border:0;background:#f1f3f8;border-radius:9px;padding:8px 11px}.modalactions{display:flex;gap:10px;margin-top:22px;justify-content:flex-end;flex-wrap:wrap}.photo-preview{display:flex;gap:10px;margin-top:8px}.photo-preview img{width:65px;height:83px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}.detail-gallery{display:flex;gap:15px;justify-content:center;flex-wrap:wrap}.detail-gallery img{width:180px;max-width:42%;aspect-ratio:3/4;object-fit:contain;background:#eef1f4;border-radius:12px}.detailline{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}.back{border:0;background:transparent;color:var(--green);font-weight:800;padding:0;margin-bottom:17px}.notice{background:#e8f5ef;color:#2f705d;border:1px solid #c6e7db;padding:13px 16px;border-radius:11px;font-size:13px;margin-bottom:18px}.utilities{display:flex;flex-wrap:wrap;gap:12px}.hide{display:none!important}@media(max-width:1150px){.stickers{grid-template-columns:repeat(4,minmax(0,1fr))}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:850px){.shell{grid-template-columns:1fr}.sidebar{padding:12px 14px;display:block}.brand{font-size:18px;padding:4px 7px 12px}.brand-mark{font-size:17px;padding:5px}.nav{display:flex;overflow-x:auto;gap:4px}.nav button{white-space:nowrap;font-size:12px;padding:10px}.nav button.active:before{display:none}.sidefoot{display:none}.main{padding:22px 16px 50px}.cards{grid-template-columns:repeat(2,1fr)}.stickers{grid-template-columns:repeat(3,1fr)}}@media(max-width:570px){.grid{grid-template-columns:1fr}.stickers{grid-template-columns:repeat(2,minmax(0,1fr))}.top{align-items:flex-start}.top .btn{font-size:12px;padding:10px}.stat{padding:15px}.stat .num{font-size:26px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:1}.modal{padding:18px}.section-title{font-size:18px}} 
</style>
</head>
<body>
<div class="shell"><aside class="sidebar"><div class="brand"><span class="brand-mark">⚽</span> Mi Álbum</div><nav class="nav" id="nav"><button data-page="home" class="active">⌂ &nbsp; Inicio</button><button data-page="collections">▦ &nbsp; Colecciones</button><button data-page="stickers">▤ &nbsp; Todos los cromos</button><button data-page="missing">◷ &nbsp; Me faltan</button><button data-page="duplicates">⇄ &nbsp; Repetidos</button><button data-page="settings">⚙ &nbsp; Datos y copias</button></nav><div class="sidefoot">Tu colección de fútbol, siempre organizada.<br><br>Prototipo local · Versión 1.0</div></aside><main class="main"><div id="app"></div></main></div><div id="modal-root"></div>
<script>
'use strict';
const KEY='mi_album_futbol_v1';
const uid=()=>crypto.randomUUID?crypto.randomUUID():String(Date.now()+Math.random());
const seed={collections:[{id:'demo-liga',name:'Liga Española 2025–26',season:'2025–26',publisher:'Colección de ejemplo',total:550},{id:'demo-mundial',name:'Mundial 2026',season:'2026',publisher:'Colección de ejemplo',total:670}],stickers:[{id:'demo-1',collectionId:'demo-liga',number:'001',name:'Jugador de ejemplo A',team:'Equipo A',rarity:'Normal',quantity:1,front:'',back:'',notes:''},{id:'demo-2',collectionId:'demo-liga',number:'002',name:'Jugador de ejemplo B',team:'Equipo B',rarity:'Especial',quantity:3,front:'',back:'',notes:''},{id:'demo-3',collectionId:'demo-mundial',number:'003',name:'Jugador de ejemplo C',team:'Selección C',rarity:'Normal',quantity:0,front:'',back:'',notes:''}]};
let db;try{db=JSON.parse(localStorage.getItem(KEY))||structuredClone(seed)}catch{db=structuredClone(seed)};
let page='home',collectionFilter='',search='',teamFilter='',stateFilter='all';
const el=id=>document.getElementById(id),escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(db));return true}catch(e){alert('El almacenamiento de este navegador está lleno. Exporta una copia de seguridad; las fotos grandes pueden ocupar mucho espacio.');return false}}
function stats(items=db.stickers){return {types:items.length,owned:items.filter(x=>x.quantity>0).length,missing:items.filter(x=>x.quantity===0).length,duplicates:items.filter(x=>x.quantity>1).length,extra:items.reduce((n,x)=>n+Math.max(0,x.quantity-1),0)}}
function status(s){return s.quantity>1?'duplicate':s.quantity>0?'owned':'missing'}
function statusLabel(s){return s.quantity>1?'Repetido ×'+s.quantity:s.quantity>0?'Lo tengo':'Me falta'}
function collName(id){return db.collections.find(c=>c.id===id)?.name||'Sin colección'}
function btn(t,fn,cl=''){return `<button class="btn ${cl}" onclick="${fn}">${t}</button>`}
function header(title,subtitle,action=''){return `<div class="top"><div><div class="eyebrow">Colección personal</div><h1 class="heading">${title}</h1><p class="sub">${subtitle}</p></div>${action}</div>`}
function statCards(){let s=stats();return `<div class="cards"><div class="stat"><div class="label">Cromos catalogados</div><div class="num">${s.types}</div><small>Fichas registradas</small></div><div class="stat"><div class="label">Los tengo</div><div class="num">${s.owned}</div><small>Distintos</small></div><div class="stat"><div class="label">Me faltan</div><div class="num">${s.missing}</div><small>Fichas pendientes</small></div><div class="stat"><div class="label">Repetidos</div><div class="num">${s.extra}</div><small>Copias adicionales</small></div></div>`}
function collectionCard(c){let s=stats(db.stickers.filter(x=>x.collectionId===c.id));let pct=c.total?Math.min(100,Math.round(s.owned/c.total*100)):0;return `<article class="collection" onclick="openCollection('${c.id}')"><div class="cover"><div class="cover-name">${escapeHtml(c.name)}</div></div><div class="collection-body"><b>${escapeHtml(c.season||'Sin temporada')}</b><div class="collection-meta">${escapeHtml(c.publisher||'Editorial no indicada')}</div><div class="between tiny"><span class="muted">${s.owned} de ${c.total||'?'} cromos</span><strong>${pct}%</strong></div><div class="progress"><span style="width:${pct}%"></span></div></div></article>`}
function stickerCard(x){return `<article class="sticker" onclick="details('${x.id}')"><div class="sticker-art">${x.front?`<img src="${x.front}" alt="Anverso de ${escapeHtml(x.name)}">`:'<span class="placeholder">⚽</span>'}</div><div class="sticker-body"><div class="sticker-title">#${escapeHtml(x.number)} · ${escapeHtml(x.name)}</div><div class="sticker-meta">${escapeHtml(x.team||collName(x.collectionId))}</div><span class="pill ${status(x)}">${statusLabel(x)}</span></div></article>`}
function empty(title,subtitle,action=''){return `<div class="empty"><div style="font-size:36px">⚽</div><h3>${title}</h3><p>${subtitle}</p>${action}</div>`}
function render(){document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page||(page==='collection'&&b.dataset.page==='collections')));let html='';
if(page==='home'){html=header('Tu colección, en orden','Organiza tus cromos de fútbol y sigue el progreso de tus álbumes',btn('＋ Añadir cromo','openStickerModal()','primary'))+`<div class="notice">Esta es una demostración funcional. Los datos se guardan en este navegador; todavía no se sincronizan por internet.</div>`+statCards()+`<div class="section-head"><h2 class="section-title">Mis colecciones</h2>${btn('＋ Nueva colección','openCollectionModal()')}</div><div class="grid">${db.collections.map(collectionCard).join('')||empty('Tu primer álbum','Crea una colección para comenzar.')}</div><div class="section-head"><h2 class="section-title">Últimos cromos</h2>${btn('Ver todos','go(\'stickers\')')}</div><div class="stickers">${db.stickers.slice(-5).reverse().map(stickerCard).join('')||empty('Aún no hay cromos','Añade el primero para verlo aquí.')}</div>`}
if(page==='collections'){html=header('Mis colecciones','Todos tus álbumes y temporadas',btn('＋ Nueva colección','openCollectionModal()','primary'))+`<div class="grid">${db.collections.map(collectionCard).join('')||empty('Sin colecciones','Crea tu primera colección.',btn('Crear colección','openCollectionModal()','primary'))}</div>`}
if(['stickers','missing','duplicates','collection'].includes(page)){let title=page==='missing'?'Cromos que faltan':page==='duplicates'?'Mis repetidos':page==='collection'?collName(collectionFilter):'Todos mis cromos';let list=db.stickers.filter(x=>(page!=='collection'||x.collectionId===collectionFilter)&&(page!=='missing'||x.quantity===0)&&(page!=='duplicates'||x.quantity>1));let teams=[...new Set(list.map(x=>x.team).filter(Boolean))].sort();let filtered=list.filter(x=>(!search||[x.name,x.number,x.team,collName(x.collectionId)].join(' ').toLowerCase().includes(search.toLowerCase()))&&(!teamFilter||x.team===teamFilter)&&(stateFilter==='all'||status(x)===stateFilter));let back=page==='collection'?`<button class="back" onclick="go('collections')">← Volver a colecciones</button>`:'';html=back+header(escapeHtml(title),`${list.length} fichas · Busca, filtra y actualiza tu colección`,btn('＋ Añadir cromo','openStickerModal()','primary'))+`<div class="toolbar"><input id="search" class="input search" placeholder="Buscar jugador, número, equipo..." value="${escapeHtml(search)}" oninput="search=this.value;renderListOnly()"><select class="select" onchange="teamFilter=this.value;renderListOnly()"><option value="">Todos los equipos</option>${teams.map(t=>`<option ${teamFilter===t?'selected':''} value="${escapeHtml(t)}">${escapeHtml(t)}</option>`).join('')}</select><select class="select" onchange="stateFilter=this.value;renderListOnly()"><option value="all">Todos los estados</option><option value="owned" ${stateFilter==='owned'?'selected':''}>Los tengo</option><option value="missing" ${stateFilter==='missing'?'selected':''}>Me faltan</option><option value="duplicate" ${stateFilter==='duplicate'?'selected':''}>Repetidos</option></select></div><div id="sticker-list" class="stickers">${filtered.map(stickerCard).join('')||empty('No hay resultados','Prueba con otros filtros o añade un cromo.')}</div>`;window.currentList=list}
if(page==='settings'){html=header('Datos y copias de seguridad','Exporta e importa tu colección')+`<div class="panel"><h2 class="section-title">Tu información</h2><p class="muted">Esta primera versión almacena tus colecciones e imágenes en el navegador actual. Para usarlas de forma sincronizada desde otros dispositivos necesitaremos añadir una base de datos online y acceso privado.</p><div class="utilities">${btn('↓ Exportar copia JSON','exportData()','primary')}<label class="btn" style="cursor:pointer">↑ Importar copia JSON<input type="file" accept="application/json" style="display:none" onchange="importData(this.files[0])"></label>${btn('Restablecer demo','resetData()','danger')}</div><p class="tiny muted">Consejo: exporta copias regularmente. Las imágenes grandes pueden llenar el espacio del navegador.</p></div>`}
el('app').innerHTML=html}
function renderListOnly(){let keep=document.activeElement?.id==='search';let pos=keep?document.activeElement.selectionStart:0;render();if(keep){let a=el('search');a?.focus();a?.setSelectionRange(pos,pos)}}
function go(p){page=p;search='';teamFilter='';stateFilter='all';render();window.scrollTo(0,0)}
function openCollection(id){collectionFilter=id;go('collection')}
function modal(content){el('modal-root').innerHTML=`<div class="modal-back" onclick="if(event.target===this)closeModal()"><div class="modal">${content}</div></div>`}
function closeModal(){el('modal-root').innerHTML=''}
function openCollectionModal(id=''){let c=db.collections.find(x=>x.id===id);modal(`<div class="modalhead"><h2>${c?'Editar':'Nueva'} colección</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveCollection(event,'${id}')"><div class="formgrid"><label class="field full">Nombre de la colección<input name="name" class="input" required maxlength="100" value="${escapeHtml(c?.name||'')}" placeholder="Ej.: Liga Este 2025-26"></label><label class="field">Temporada<input name="season" class="input" value="${escapeHtml(c?.season||'')}" placeholder="2025–26"></label><label class="field">Editorial<input name="publisher" class="input" value="${escapeHtml(c?.publisher||'')}" placeholder="Panini"></label><label class="field">Total de cromos del álbum<input name="total" class="input" type="number" min="0" max="100000" value="${c?.total||0}"></label></div><div class="modalactions">${c?btn('Eliminar','deleteCollection(\''+id+'\')','danger'):''}<button class="btn" type="button" onclick="closeModal()">Cancelar</button><button class="btn primary" type="submit">Guardar colección</button></div></form>`)}
function saveCollection(e,id){e.preventDefault();let f=new FormData(e.target);let obj={id:id||uid(),name:String(f.get('name')).trim(),season:String(f.get('season')).trim(),publisher:String(f.get('publisher')).trim(),total:Number(f.get('total'))||0};if(!obj.name)return;if(id){let i=db.collections.findIndex(x=>x.id===id);db.collections[i]=obj}else db.collections.push(obj);save();closeModal();render()}
function deleteCollection(id){if(!confirm('¿Borrar esta colección y todos sus cromos?'))return;db.collections=db.collections.filter(x=>x.id!==id);db.stickers=db.stickers.filter(x=>x.collectionId!==id);save();closeModal();go('collections')}
let uploadedFront='',uploadedBack='';
function openStickerModal(id=''){if(!db.collections.length){alert('Primero crea una colección.');openCollectionModal();return}let s=db.stickers.find(x=>x.id===id);uploadedFront=s?.front||'';uploadedBack=s?.back||'';modal(`<div class="modalhead"><h2>${s?'Editar':'Añadir'} cromo</h2><button class="close" onclick="closeModal()">✕</button></div><form onsubmit="saveSticker(event,'${id}')"><div class="formgrid"><label class="field full">Colección<select class="select" name="collectionId" required>${db.collections.map(c=>`<option value="${c.id}" ${(s?.collectionId||collectionFilter)===c.id?'selected':''}>${escapeHtml(c.name)}</option>`).join('')}</select></label><label class="field">Número<input class="input" name="number" required maxlength="25" value="${escapeHtml(s?.number||'')}" placeholder="001"></label><label class="field">Jugador / nombre<input class="input" name="name" required maxlength="120" value="${escapeHtml(s?.name||'')}" placeholder="Nombre del jugador"></label><label class="field">Equipo<input class="input" name="team" maxlength="100" value="${escapeHtml(s?.team||'')}" placeholder="Real Madrid"></label><label class="field">Rareza<select class="select" name="rarity">${['Normal','Brillante','Especial','Limitada','Otra'].map(r=>`<option ${s?.rarity===r?'selected':''}>${r}</option>`).join('')}</select></label><label class="field">Cantidad que tengo<input class="input" type="number" min="0" max="9999" name="quantity" required value="${s?.quantity??1}"><small>0 = falta · 1 = tengo · 2 o más = repetidos</small></label><label class="field">Fotografía frontal<input type="file" class="input" accept="image/*" onchange="loadPhoto(this,'front')"><div id="preview-front" class="photo-preview">${uploadedFront?`<img src="${uploadedFront}" alt="Vista previa frontal">`:''}</div></label><label class="field">Fotografía trasera<input type="file" class="input" accept="image/*" onchange="loadPhoto(this,'back')"><div id="preview-back" class="photo-preview">${uploadedBack?`<img src="${uploadedBack}" alt="Vista previa trasera">`:''}</div></label><label class="field full">Notas<textarea class="textarea" name="notes" placeholder="Detalles del cromo...">${escapeHtml(s?.notes||'')}</textarea></label></div><div class="modalactions">${s?btn('Eliminar','deleteSticker(\''+id+'\')','danger'):''}<button class="btn" type="button" onclick="closeModal()">Cancelar</button><button type="submit" class="btn primary">Guardar cromo</button></div></form>`)}
async function loadPhoto(input,kind){let file=input.files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('Selecciona una imagen válida.');return}let img=new Image();let url=URL.createObjectURL(file);try{await new Promise((res,rej)=>{img.onload=res;img.onerror=rej;img.src=url});let canvas=document.createElement('canvas');let scale=Math.min(1,950/Math.max(img.width,img.height));canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);let data=canvas.toDataURL('image/jpeg',.78);if(kind==='front')uploadedFront=data;else uploadedBack=data;el('preview-'+kind).innerHTML=`<img src="${data}" alt="Vista previa">`}catch{alert('No se ha podido abrir la imagen.')}finally{URL.revokeObjectURL(url)}}
function saveSticker(e,id){e.preventDefault();let f=new FormData(e.target);let obj={id:id||uid(),collectionId:String(f.get('collectionId')),number:String(f.get('number')).trim(),name:String(f.get('name')).trim(),team:String(f.get('team')).trim(),rarity:String(f.get('rarity')),quantity:Math.max(0,Number(f.get('quantity'))||0),front:uploadedFront,back:uploadedBack,notes:String(f.get('notes')).trim()};if(!obj.number||!obj.name)return;let old=structuredClone(db);if(id)db.stickers[db.stickers.findIndex(x=>x.id===id)]=obj;else db.stickers.push(obj);if(!save())db=old;else{closeModal();render()}}
function deleteSticker(id){if(!confirm('¿Eliminar este cromo?'))return;db.stickers=db.stickers.filter(x=>x.id!==id);save();closeModal();render()}
function details(id){let s=db.stickers.find(x=>x.id===id);if(!s)return;modal(`<div class="modalhead"><h2>#${escapeHtml(s.number)} · ${escapeHtml(s.name)}</h2><button class="close" onclick="closeModal()">✕</button></div><div class="detail-gallery">${s.front?`<img src="${s.front}" alt="Anverso">`:''}${s.back?`<img src="${s.back}" alt="Reverso">`:''}${!s.front&&!s.back?'<div class="empty">Todavía no hay fotografías.</div>':''}</div><div style="margin-top:18px"><div class="detailline"><b>Colección</b><span>${escapeHtml(collName(s.collectionId))}</span></div><div class="detailline"><b>Equipo</b><span>${escapeHtml(s.team||'—')}</span></div><div class="detailline"><b>Rareza</b><span>${escapeHtml(s.rarity||'—')}</span></div><div class="detailline"><b>Estado</b><span>${statusLabel(s)}</span></div><div class="detailline"><b>Notas</b><span>${escapeHtml(s.notes||'—')}</span></div></div><div class="modalactions">${btn('− Una copia',`adjustQuantity('${id}',-1)`)}${btn('＋ Una copia',`adjustQuantity('${id}',1)`,'primary')}${btn('Editar','openStickerModal(\''+id+'\')')}</div>`)}
function adjustQuantity(id,by){let s=db.stickers.find(x=>x.id===id);s.quantity=Math.max(0,s.quantity+by);save();details(id);render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'});let url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='mi-album-cromos-'+new Date().toISOString().slice(0,10)+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),3000)}
async function importData(file){if(!file)return;try{let data=JSON.parse(await file.text());if(!Array.isArray(data.collections)||!Array.isArray(data.stickers))throw Error('Formato incorrecto');if(!confirm('Esto sustituirá los datos actuales por los de la copia. ¿Continuar?'))return;db=data;if(save())go('home')}catch(e){alert('No se ha podido importar la copia: '+e.message)}}
function resetData(){if(!confirm('Esto borrará tus datos de este navegador y restaurará los ejemplos. ¿Continuar?'))return;db=structuredClone(seed);save();go('home')}
document.querySelectorAll('#nav button').forEach(b=>b.addEventListener('click',()=>go(b.dataset.page)));render();
</script>
